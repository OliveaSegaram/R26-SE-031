name: Build and Deploy ML Backend to Azure

on:
  push:
    branches:
      - dev
    paths:
      - 'app/backend/speech-monitoring-v1/**'
      - 'app/backend/telemetry-analytics-v1/**'
      - 'app/backend/diagnostic-fusion-v1/**'
      - 'app/backend/adaptive-tutoring-v1/**'
      - 'Dockerfile.azure'
      - 'requirements-azure.txt'
      - 'azure_gateway.py'

env:
  ACR_NAME: "sipsaramlacr2026"
  IMAGE_NAME: "sipsara-ml-backend"
  WEBAPP_NAME: "sipsara-ml-backend-app"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.ACR_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -f Dockerfile.azure -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest .

    - name: Push Docker Image to ACR
      run: |
        docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

    - name: Deploy to Azure Web App for Containers
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.WEBAPP_NAME }}
        images: '${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest'
