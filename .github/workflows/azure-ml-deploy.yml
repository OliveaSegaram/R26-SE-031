name: Build and Deploy ML Backend to Azure

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - 'temp/**'
    paths:
      - 'app/backend/speech-monitoring-v1/**'
      - 'app/backend/telemetry-analytics-v1/**'
      - 'app/backend/diagnostic-fusion-v1/**'
      - 'app/backend/adaptive-tutoring-v1/**'
      - 'Dockerfile.azure'
      - 'requirements-azure.txt'
      - 'azure_gateway.py'
      - '.dockerignore'
      - '.github/workflows/**'

env:
  ACR_NAME: "sipsaramlacr26"
  IMAGE_NAME: "sipsara-ml-backend"
  WEBAPP_NAME: "sipsara-ml-backend-v2"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.ACR_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME || 'sipsaramlacr26' }}
        password: ${{ secrets.ACR_PASSWORD || 'DnXC77q5IrT9IYTI3qmiKnIxfRu1dFsKlDSwk9R3xjptPN9AiD3ZJQQJ99CJAC3pKaREqg7NAAACAZCRQAK5' }}

    - name: Build Docker Image
      run: |
        docker build -f Dockerfile.azure -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest .

    - name: Push Docker Image to ACR
      run: |
        docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
