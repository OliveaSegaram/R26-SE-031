name: Trigger Render API Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'app/backend/api/**'
      - 'render.yaml'
      - '.github/workflows/render-api-deploy.yml'

jobs:
  deploy-to-render:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: test -n "$RENDER_DEPLOY_HOOK_URL"

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering deployment to Render..."
          curl --fail-with-body --retry 3 -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo -e "\nRender deployment triggered successfully!"
