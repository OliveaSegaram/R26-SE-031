<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptedMind - Math Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fredoka+One&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    /* ── Blurred map background ── */
    .bg-blurred {
      position: fixed;
      inset: 0;
      background-image: url('new-map.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(25px) brightness(1.05) saturate(1.2);
      transform: scale(1.1);
      z-index: 0;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.08);
      z-index: 0;
    }

    /* ── Root layout ── */
    #root {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ══════════════════════════
     TOP BAR
  ══════════════════════════ */
    #top-bar {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      gap: 16px;
      position: relative;
      flex-shrink: 0;
    }

    /* X close button */
    #btn-close {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ff6ec7, #e0157a);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #a00d55, 0 6px 16px rgba(0, 0, 0, 0.35);
      flex-shrink: 0;
      transition: transform .1s, box-shadow .1s;
      position: relative;
      z-index: 10;
    }

    #btn-close:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #a00d55, 0 3px 8px rgba(0, 0, 0, 0.3);
    }

    #btn-close svg {
      width: 28px;
      height: 28px;
    }

    /* Progress track */
    #progress-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0;
      position: relative;
    }

    /* character sprite */
    #char-rocket {
      position: absolute;
      left: -12px;
      top: 50%;
      transform: translateY(-60%);
      z-index: 5;
      width: 60px;
      height: 60px;
      transition: left 0.6s ease-in-out;
    }

    #char-rocket img,
    #char-rocket svg {
      width: 100%;
      height: 100%;
    }

    #progress-track {
      flex: 1;
      height: 14px;
      background: linear-gradient(180deg, #d0d0d0 0%, #e8e8e8 50%, #c0c0c0 100%);
      border-radius: 10px;
      margin: 0 10px 0 32px;
      position: relative;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.25), 0 2px 0 rgba(255, 255, 255, 0.6);
      overflow: visible;
    }

    #progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(180deg, #5cdd3c 0%, #3ab820 50%, #2fa018 100%);
      border-radius: 10px;
      transition: width 0.6s ease-in-out;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4);
    }

    .progress-dot {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #e0e0e0, #b0b0b0);
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .progress-dot.dot1 {
      left: 38%;
    }

    .progress-dot.dot2 {
      left: 65%;
    }

    /* egg reward */
    #egg-reward {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      position: relative;
    }

    /* score */
    #score-box {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 10px;
      background: linear-gradient(180deg, #f5c04a 0%, #e8a020 50%, #d4890e 100%);
      padding: 6px 6px 6px 18px;
      border-radius: 30px;
      box-shadow: 0 4px 0 #b8730a, 0 6px 14px rgba(0, 0, 0, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
    }

    #score-num {
      font-family: 'Fredoka One', cursive;
      font-size: 30px;
      color: #fff;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    #score-gem {
      width: 40px;
      height: 40px;
      margin: -4px -2px -4px 0;
    }

    /* ══════════════════════════
     LEFT SIDEBAR
  ══════════════════════════ */
    #sidebar-left {
      position: fixed;
      left: 14px;
      top: 88px;
      z-index: 10;
    }

    #btn-video {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4ecde0 0%, #2aafbf 100%);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #178a9a, 0 6px 16px rgba(0, 0, 0, 0.3);
      transition: transform .1s, box-shadow .1s;
      position: relative;
      overflow: hidden;
    }

    #btn-video:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #178a9a;
    }

    #btn-video .blackboard {
      width: 46px;
      height: 38px;
      background: #2d5a1b;
      border-radius: 4px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #4a3728;
    }

    #btn-video .blackboard::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 6px;
      background: #4a3728;
      border-radius: 0 0 4px 4px;
    }

    #btn-video .play-tri {
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 16px solid #fff;
      margin-left: 3px;
    }

    /* apple on blackboard */
    #btn-video .apple-decor {
      position: absolute;
      top: -6px;
      right: -6px;
      font-size: 16px;
    }

    /* ══════════════════════════
     MAIN CONTENT AREA
  ══════════════════════════ */
    #main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 90px;
      padding-left: 100px;
    }

    /* Question card */
    #question-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 960px;
      min-height: 500px;
      padding: 36px 40px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
    }

    .question-row {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    /* Sound button */
    .btn-sound {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #d966cc, #b020a8);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #7a1080, 0 5px 12px rgba(0, 0, 0, 0.25);
      transition: transform .1s, box-shadow .1s;
      flex-shrink: 0;
    }

    .btn-sound:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #7a1080;
    }

    .btn-sound svg {
      width: 26px;
      height: 26px;
    }

    .question-text {
      font-family: 'Fredoka One', cursive;
      font-size: 28px;
      color: #333;
      white-space: nowrap;
    }

    .answer-input {
      width: 120px;
      height: 46px;
      border: 2px solid #6ab0f5;
      border-radius: 6px;
      font-size: 24px;
      font-family: 'Fredoka One', cursive;
      text-align: center;
      color: #333;
      outline: none;
      caret-color: #333;
      transition: border-color .2s, box-shadow .2s;
      padding: 0;
      padding-bottom: 6px;
    }

    .answer-input:focus {
      border-color: #3a8ee8;
      box-shadow: 0 0 0 3px rgba(58, 142, 232, 0.2);
    }

    /* ══════════════════════════
     RIGHT SIDEBAR
  ══════════════════════════ */
    #sidebar-right {
      position: fixed;
      right: 14px;
      top: 140px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    /* Pet door */
    #pet-door {
      width: 80px;
      cursor: pointer;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.35));
      transition: transform .15s;
    }

    #pet-door:hover {
      transform: scale(1.05);
    }

    /* Shop bag */
    #shop-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(145deg, #4dc8f0, #2b9ec8);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #1a7099, 0 6px 16px rgba(0, 0, 0, 0.3);
      transition: transform .1s, box-shadow .1s;
    }

    #shop-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1a7099;
    }

    #shop-btn svg {
      width: 36px;
      height: 36px;
      color: #fff;
    }

    /* ══════════════════════════
     BOTTOM NUMPAD
  ══════════════════════════ */
    #bottom-bar {
      flex-shrink: 0;
      padding: 10px 90px 14px 100px;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 0;
    }

    #numpad {
      flex: 1;
      max-width: 960px;
      background: linear-gradient(180deg, #2a3a8c 0%, #1a2a6c 100%);
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .num-btn {
      flex: 1;
      height: 64px;
      border-radius: 12px;
      background: linear-gradient(180deg, #5cdd3c 0%, #3ab820 50%, #2fa018 100%);
      border: none;
      cursor: pointer;
      font-family: 'Fredoka One', cursive;
      font-size: 28px;
      color: #fff;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
      box-shadow: 0 5px 0 #1d7010, 0 7px 14px rgba(0, 0, 0, 0.3);
      transition: transform .08s, box-shadow .08s;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .num-btn::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 8px;
      right: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }

    .num-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #1d7010, 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .num-btn:hover {
      filter: brightness(1.08);
    }

    /* Eraser button */
    .erase-btn {
      flex: 1;
      height: 64px;
      border-radius: 12px;
      background: linear-gradient(180deg, #e060d0 0%, #c030b0 50%, #a020a0 100%);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 0 #7a1080, 0 7px 14px rgba(0, 0, 0, 0.3);
      transition: transform .08s, box-shadow .08s;
      position: relative;
      overflow: hidden;
    }

    .erase-btn::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 8px;
      right: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .erase-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #7a1080, 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .erase-btn svg {
      width: 32px;
      height: 32px;
    }

    /* ══════════════════════════
     CHECKMARK BUTTON (bottom right)
  ══════════════════════════ */
    #btn-submit {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #6ae860, #2ec820);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 0 #1a8a0e, 0 8px 20px rgba(0, 0, 0, 0.4);
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 20;
      transition: transform .1s, box-shadow .1s;
    }

    #btn-submit:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #1a8a0e, 0 3px 10px rgba(0, 0, 0, 0.3);
    }

    #btn-submit:hover {
      filter: brightness(1.08);
    }

    #btn-submit svg {
      width: 48px;
      height: 48px;
    }

    /* ══════════════════════════
     FEEDBACK OVERLAY (correct / wrong)
  ══════════════════════════ */
    #feedback {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s;
    }

    #feedback.show {
      opacity: 1;
      pointer-events: all;
    }

    .feedback-bubble {
      font-family: 'Fredoka One', cursive;
      font-size: 80px;
      animation: popIn .4s cubic-bezier(.36, 1.4, .64, 1) both;
    }

    @keyframes popIn {
      from {
        transform: scale(0) rotate(-15deg);
        opacity: 0;
      }

      to {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    /* Pulse animation for sound button */
    .btn-sound.pulsing {
      animation: pulse .6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.12);
      }
    }

    /* Score +10 float */
    .score-float {
      position: fixed;
      top: 50px;
      right: 100px;
      font-family: 'Fredoka One', cursive;
      font-size: 32px;
      color: #2ec820;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      animation: floatUp 1.2s ease-out forwards;
      z-index: 200;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0);
        opacity: 1;
      }

      100% {
        transform: translateY(-80px);
        opacity: 0;
      }
    }

    /* ══ Responsive ══ */
    @media (max-width: 700px) {
      .num-btn {
        font-size: 20px;
        height: 52px;
      }

      #score-num {
        font-size: 24px;
      }

      #question-card {
        min-height: 300px;
      }

      .question-text {
        font-size: 22px;
      }

      #bottom-bar {
        padding: 10px 16px 14px 16px;
      }
    }
  </style>
</head>

<body>

  <!-- Blurred map background -->
  <div class="bg-blurred"></div>
  <div class="bg-overlay"></div>

  <div id="root">

    <!-- ═══════════ TOP BAR ═══════════ -->
    <div id="top-bar">

      <!-- X Close Button -->
      <button id="btn-close" title="Exit">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round">
          <line x1="5" y1="5" x2="19" y2="19" />
          <line x1="19" y1="5" x2="5" y2="19" />
        </svg>
      </button>

      <!-- Character + Progress Track -->
      <div id="progress-wrap">

        <!-- Rocket character (SVG drawn inline) -->
        <div id="char-rocket">
          <svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
            <!-- Rocket body -->
            <ellipse cx="30" cy="32" rx="14" ry="20" fill="#f5a623" />
            <ellipse cx="30" cy="32" rx="14" ry="20" fill="url(#rocketGrad)" />
            <!-- Nose cone -->
            <ellipse cx="30" cy="14" rx="14" ry="10" fill="#f5a623" />
            <path d="M16 22 Q30 5 44 22" fill="#f5a623" />
            <!-- Purple monster face on rocket -->
            <ellipse cx="30" cy="30" rx="11" ry="12" fill="#7c3aed" />
            <!-- Eyes -->
            <ellipse cx="25" cy="27" rx="4" ry="4.5" fill="white" />
            <ellipse cx="35" cy="27" rx="4" ry="4.5" fill="white" />
            <circle cx="26" cy="27" r="2.5" fill="#1a1a1a" />
            <circle cx="36" cy="27" r="2.5" fill="#1a1a1a" />
            <circle cx="27" cy="26" r="1" fill="white" />
            <circle cx="37" cy="26" r="1" fill="white" />
            <!-- Horns -->
            <path d="M22 17 L18 10 L25 15" fill="#5b21b6" />
            <path d="M38 17 L42 10 L35 15" fill="#5b21b6" />
            <!-- Teeth / smile -->
            <path d="M24 35 Q30 40 36 35" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" />
            <!-- Flame -->
            <path d="M22 50 Q25 62 30 58 Q35 62 38 50" fill="#ff6b1a" opacity=".9" />
            <path d="M24 50 Q27 60 30 56 Q33 60 36 50" fill="#ffd700" />
            <defs>
              <linearGradient id="rocketGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#fbbf24" />
                <stop offset="100%" stop-color="#d97706" />
              </linearGradient>
            </defs>
          </svg>
        </div>

        <!-- Track bar -->
        <div id="progress-track">
          <div id="progress-fill"></div>
          <div class="progress-dot dot1"></div>
          <div class="progress-dot dot2"></div>
        </div>

        <!-- Egg reward -->
        <div id="egg-reward">
          <svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
            <!-- pedestal / charger -->
            <rect x="12" y="52" width="36" height="14" rx="7" fill="#2a2a2a" />
            <rect x="18" y="50" width="24" height="6" rx="3" fill="#444" />
            <!-- lightning bolt on base -->
            <text x="30" y="60" text-anchor="middle" font-size="10" fill="#ffd700">⚡</text>
            <!-- egg -->
            <ellipse cx="30" cy="32" rx="18" ry="22" fill="#f5f0e8" />
            <ellipse cx="30" cy="32" rx="18" ry="22" fill="url(#eggGrad)" opacity=".5" />
            <!-- shine -->
            <ellipse cx="23" cy="22" rx="5" ry="7" fill="rgba(255,255,255,0.55)" transform="rotate(-20,23,22)" />
            <defs>
              <radialGradient id="eggGrad" cx="35%" cy="30%">
                <stop offset="0%" stop-color="white" />
                <stop offset="100%" stop-color="#c8b896" />
              </radialGradient>
            </defs>
          </svg>
        </div>
      </div>

      <!-- Score -->
      <div id="score-box">
        <span id="score-num">185</span>
        <!-- Pink gem diamond -->
        <svg id="score-gem" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <polygon points="20,2 38,14 20,38 2,14" fill="url(#gemGrad)" />
          <polygon points="20,2 38,14 20,18 2,14" fill="rgba(255,255,255,0.3)" />
          <polygon points="20,2 30,14 20,18 10,14" fill="rgba(255,255,255,0.15)" />
          <defs>
            <linearGradient id="gemGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff6ec7" />
              <stop offset="50%" stop-color="#e8208a" />
              <stop offset="100%" stop-color="#c0006a" />
            </linearGradient>
          </defs>
        </svg>
      </div>

    </div><!-- /top-bar -->

    <!-- ═══════════ LEFT SIDEBAR ═══════════ -->
    <div id="sidebar-left">
      <button id="btn-video" title="Watch lesson">
        <div class="blackboard">
          <div class="play-tri"></div>
          <span class="apple-decor">🍎</span>
        </div>
      </button>
    </div>

    <!-- ═══════════ MAIN QUESTION AREA ═══════════ -->
    <div id="main-area">
      <div id="question-card">
        <div class="question-row">
          <button class="btn-sound" id="soundBtn" title="Read question aloud">
            <svg viewBox="0 0 24 24" fill="white">
              <path d="M3 9v6h4l5 5V4L7 9H3z" />
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" opacity=".7" />
              <path
                d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06C18.01 19.86 21 16.28 21 12c0-4.28-2.99-7.86-7-8.77z"
                opacity=".4" />
            </svg>
          </button>
          <span class="question-text" id="questionText">What is 16 - 1?</span>
          <input class="answer-input" id="answerInput" type="text" inputmode="none" autocomplete="off" maxlength="3"
            placeholder="" />
        </div>
      </div>
    </div>

    <!-- ═══════════ RIGHT SIDEBAR ═══════════ -->
    <div id="sidebar-right">
      <!-- Pet door (golden) -->
      <div id="pet-door" title="Pet">
        <svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg" width="80" height="100">
          <!-- Door frame -->
          <rect x="4" y="10" width="72" height="86" rx="10" fill="#b8730a" />
          <rect x="8" y="14" width="64" height="78" rx="8" fill="#d4890e" />
          <!-- Door panels -->
          <rect x="12" y="18" width="56" height="30" rx="5" fill="#e8a020" />
          <rect x="12" y="54" width="56" height="32" rx="5" fill="#e8a020" />
          <!-- Panel inset highlights -->
          <rect x="15" y="21" width="50" height="24" rx="3" fill="none" stroke="#f5c050" stroke-width="1.5"
            opacity=".6" />
          <rect x="15" y="57" width="50" height="26" rx="3" fill="none" stroke="#f5c050" stroke-width="1.5"

          <path d="M4 20 Q4 8 16 8 L64 8 Q76 8 76 20" fill="#b8730a" />
          <path d="M8 20 Q8 12 18 12 L62 12 Q72 12 72 20" fill="#d4890e" />
          <!-- Door knob -->
          <circle cx="54" cy="55" r="5" fill="#f5c050" />
          <circle cx="54" cy="55" r="3" fill="#e8a020" />

          <text x="40" y="8" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="9"
            fill="white" letter-spacing="1">Pet</text>
          <!-- Paw prints subtle -->
          <text x="30" y="46" font-size="14" text-anchor="middle">🐾</text>
          <text x="50" y="80" font-size="12" text-anchor="middle">🐾</text>
          <!-- "1" badge -->
          <circle cx="68" cy="14" r="10" fill="#e8208a" />

      <!-- Shop button -->
      <button id="shop-btn" title="Shop">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Shopping bag body -->
          <rect x="4" y="9" width="16" height="12" rx="3" fill="white" />
          <!-- Bag top flap -->
          <rect x="3" y="7" width="18" height="3" rx="1" fill="white" opacity=".85" />
          <!-- Handles -->
          <path d="M9 7 C9 4.5 10.3 3 12 3 C13.7 3 15 4.5 15 7" stroke="white" stroke-width="2.5" fill="none"

    <!-- ═══════════ BOTTOM NUMPAD ═══════════ -->
    <div id="bottom-bar">
      <div id="numpad">
        <button class="num-btn" data-val="0">0</button>
        <button class="num-btn" data-val="1">1</button>
        <button class="num-btn" data-val="2">2</button>
        <button class="num-btn" data-val="3">3</button>
        <button class="num-btn" data-val="4">4</button>
        <button class="num-btn" data-val="5">5</button>
        <button class="num-btn" data-val="6">6</button>
        <button class="num-btn" data-val="7">7</button>
        <button class="num-btn" data-val="8">8</button>
        <button class="num-btn" data-val="9">9</button>
        <button class="erase-btn" id="eraseBtn" title="Backspace">
          <!-- Eraser icon -->
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="11" width="20" height="11" rx="3" fill="white" opacity=".9" transform="rotate(-5,14,16.5)" />
            <rect x="14" y="10.5" width="10" height="11" rx="2" fill="#ffb3e8" transform="rotate(-5,19,16)" />
            <line x1="14" y1="10" x2="13" y2="23" stroke="white" stroke-width="1.5" />
            <path d="M6 22 L4 25 H16 L14 22 Z" fill="white" opacity=".6" />
          </svg>
        </button>

  </div><!-- /root -->

  <!-- Submit checkmark button -->
  <button id="btn-submit" title="Submit answer">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"
      stroke-linejoin="round">
      <polyline points="4,13 9,18 20,6" />
    </svg>
  </button>

  <!-- Feedback overlay -->
  <div id="feedback">
    <div class="feedback-bubble" id="feedbackBubble"></div>
  </div>



  <!-- ═══════════ GAME LOGIC ═══════════ -->
  <script>
    (function () {

      // ── State ──
      let score = 185;
      let currentQ = { a: 16, b: 1, op: '-' };
      let answerVal = '';
      let isAnimating = false;

      const scoreEl = document.getElementById('score-num');
      const inputEl = document.getElementById('answerInput');
      const qTextEl = document.getElementById('questionText');
      const feedbackEl = document.getElementById('feedback');
      const bubbleEl = document.getElementById('feedbackBubble');
      const soundBtn = document.getElementById('soundBtn');

      // ── Questions pool ──
      const questions = [
        { a: 16, b: 1, op: '-' },
        { a: 8, b: 3, op: '+' },
        { a: 5, b: 5, op: '*' },
        { a: 12, b: 4, op: '-' },
        { a: 9, b: 7, op: '+' },
        { a: 4, b: 3, op: '*' },
        { a: 18, b: 6, op: '-' },
        { a: 6, b: 8, op: '+' },
      ];
      let qIdx = 0;
      let correctCount = 0;

      function getAnswer(q) {
        if (q.op === '+') return q.a + q.b;
        if (q.op === '-') return q.a - q.b;
        if (q.op === '*') return q.a * q.b;
      }

      function opSymbol(op) {
        return op === '*' ? '×' : op;
      }

      function loadQuestion(q) {
        const sym = opSymbol(q.op);
        qTextEl.textContent = `What is ${q.a} ${sym} ${q.b}?`;
        answerVal = '';
        inputEl.value = '';
        inputEl.focus();
      }

      // ── Numpad ──
      document.querySelectorAll('.num-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (isAnimating) return;
          if (answerVal.length < 3) {
            answerVal += btn.dataset.val;
            inputEl.value = answerVal;
            // Bounce animation on input
            inputEl.style.transition = 'transform .1s';
            inputEl.style.transform = 'scale(1.12)';
            setTimeout(() => { inputEl.style.transform = 'scale(1)'; }, 120);
          }
        });
      });

      document.getElementById('eraseBtn').addEventListener('click', () => {
        if (isAnimating) return;
        answerVal = answerVal.slice(0, -1);
        inputEl.value = answerVal;
      });

      // ── Keyboard support ──
      document.addEventListener('keydown', (e) => {
        if (isAnimating) return;
        if (e.key >= '0' && e.key <= '9' && answerVal.length < 3) {
          answerVal += e.key;
          inputEl.value = answerVal;
        } else if (e.key === 'Backspace') {
          answerVal = answerVal.slice(0, -1);
          inputEl.value = answerVal;
        } else if (e.key === 'Enter') {
          submitAnswer();
        }
      });

      // ── Submit ──
      document.getElementById('btn-submit').addEventListener('click', submitAnswer);

      function submitAnswer() {
        if (isAnimating || answerVal === '') return;
        const correct = parseInt(answerVal) === getAnswer(currentQ);
        isAnimating = true;

        if (correct) {
          score += 10;
          scoreEl.textContent = score;

          correctCount++;
          const rocket = document.getElementById('char-rocket');
          const progressFill = document.getElementById('progress-fill');
          const maxQuestions = questions.length;
          const percentage = Math.min((correctCount / maxQuestions) * 100, 100);
          rocket.style.left = `calc(${percentage}% - 12px)`;
          progressFill.style.width = `${percentage}%`;

          showFeedback('✅', true);
          spawnScoreFloat('+10');
        } else {
          showFeedback('❌', false);
        }
      }

      function showFeedback(emoji, isCorrect) {
        bubbleEl.textContent = emoji;
        feedbackEl.classList.add('show');
        setTimeout(() => {
          feedbackEl.classList.remove('show');
          isAnimating = false;
          if (isCorrect) {
            qIdx = (qIdx + 1) % questions.length;
            currentQ = questions[qIdx];
            loadQuestion(currentQ);
          } else {
            answerVal = '';
            inputEl.value = '';
            inputEl.focus();
          }
        }, 800);
      }

      function spawnScoreFloat(text) {
        const el = document.createElement('div');
        el.className = 'score-float';
        el.textContent = text;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1300);
      }

      // ── Sound button ──
      soundBtn.addEventListener('click', () => {
        if ('speechSynthesis' in window) {
          const q = currentQ;
          const sym = q.op === '*' ? 'times' : q.op === '-' ? 'minus' : 'plus';
          const utter = new SpeechSynthesisUtterance(`What is ${q.a} ${sym} ${q.b}?`);
          utter.rate = 0.9;
          soundBtn.classList.add('pulsing');
          speechSynthesis.speak(utter);
          utter.onend = () => soundBtn.classList.remove('pulsing');
        }
      });

      // ── Exit button link to level select map ──
      const closeBtn = document.getElementById('btn-close');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          window.location.href = "03-level-map.html";
        });
      }

      // ── Init ──
      currentQ = questions[qIdx];
      loadQuestion(currentQ);

      // ── Score counter animation on load ──
      let displayScore = 0;
      const target = 185;
      const step = Math.ceil(target / 40);
      const counter = setInterval(() => {
        displayScore = Math.min(displayScore + step, target);
        scoreEl.textContent = displayScore;
        if (displayScore >= target) clearInterval(counter);
      }, 30);

    })();
  </script>

</body>
