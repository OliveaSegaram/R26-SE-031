<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptedMind - Who's Learning?</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ══════════════════════════
       BLURRED BACKGROUND
    ══════════════════════════ */
    .bg-blurred {
      position: fixed;
      inset: 0;
      background-image: url('assets/images/backgrounds/new-map.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(25px) brightness(1.05) saturate(1.2);
      transform: scale(1.1); /* prevents white edges from blur */
      z-index: 0;
    }

    /* Subtle color overlay for warmth */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.08);
      z-index: 1;
    }

    /* ══════════════════════════
       CONTENT WRAPPER
    ══════════════════════════ */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      padding-top: 0;
    }

    /* ══════════════════════════
       HEADER CURVE
    ══════════════════════════ */
    .header-curve {
      width: 100%;
      text-align: center;
      position: relative;
    }

    .header-curve svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .header-title {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Fredoka One', cursive;
      font-size: clamp(28px, 4.5vw, 52px);
      color: #1565c0;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.08);
      white-space: nowrap;
      letter-spacing: 1px;
    }

    /* ══════════════════════════
       STUDENT CARD
    ══════════════════════════ */
    .students-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
    }

    .student-card {
      width: clamp(160px, 22vw, 240px);
      background: #fff;
      border-radius: 20px;
      padding: 16px 16px 20px;
      text-align: center;
      cursor: pointer;
      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.15),
        0 2px 8px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  box-shadow 0.2s;
    }

    .student-card:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.2),
        0 4px 12px rgba(0, 0, 0, 0.1);
    }

    .student-card:active {
      transform: translateY(-2px) scale(1.0);
    }

    .avatar-wrapper {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      /* Add a white circle behind the eye, with the orange gradient underneath */
      background: radial-gradient(circle at 50% 43%, #fff 0%, #fff 16%, transparent 16.5%), linear-gradient(135deg, #ffe0b2 0%, #fff3e0 100%);
      margin-bottom: 12px;
      position: relative;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .student-name {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(18px, 2.5vw, 28px);
      color: #1565c0;
      letter-spacing: 0.5px;
    }

    /* ══════════════════════════
       BOTTOM BUTTONS
    ══════════════════════════ */
    .bottom-actions {
      padding: 20px;
      padding-bottom: 40px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 40px;
      border: none;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(16px, 2vw, 22px);
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 50%, #2196f3 100%);
      box-shadow: 0 4px 0 #1565c0, 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #1565c0, 0 10px 24px rgba(0, 0, 0, 0.25);
    }

    .action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1565c0, 0 3px 8px rgba(0, 0, 0, 0.15);
    }

    .action-btn svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* ══════════════════════════
       RESPONSIVE
    ══════════════════════════ */
    @media (max-height: 600px) {
      .header-curve svg {
        height: 80px;
      }
      .header-title {
        top: 20%;
        font-size: 24px;
      }
      .students-area {
        padding: 5px 20px;
      }
      .bottom-actions {
        padding: 10px;
        padding-bottom: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Blurred Background Layer -->
  <div class="bg-blurred"></div>
  <div class="bg-overlay"></div>

  <!-- Main Content -->
  <div class="content">

    <!-- Curved White Header -->
    <div class="header-curve">
      <svg viewBox="0 0 1440 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,0 L1440,0 L1440,100 Q720,180 0,100 Z" fill="white"/>
      </svg>
      <h1 class="header-title">Who's Learning?</h1>
    </div>

    <!-- Student Cards Area -->
    <div class="students-area">
      <div class="student-card" id="student-ace" title="Select Ace">
        <div class="avatar-wrapper">
          <img src="assets/images/characters/character.png" alt="Monster Character">
        </div>
        <div class="student-name">Ace</div>
      </div>
    </div>

    <!-- Bottom Action Buttons -->
    <div class="bottom-actions">
      <button class="action-btn" id="btn-parent-account" title="Parent Account">
        <!-- Parent icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Parent Account
      </button>

      <button class="action-btn" id="btn-add-student" title="Add Student">
        <!-- Plus circle icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        Add Student
      </button>
    </div>

  </div>

  <script>
    // ── Student card click → navigate to map ──
    const studentCard = document.getElementById('student-ace');
    if (studentCard) {
      studentCard.addEventListener('click', () => {
        window.location.href = '02-dashboard.html';
      });
    }

    // ── Parent Account button ──
    const parentBtn = document.getElementById('btn-parent-account');
    if (parentBtn) {
      parentBtn.addEventListener('click', () => {
        alert('Parent Account settings coming soon!');
      });
    }

    // ── Add Student button ──
    const addBtn = document.getElementById('btn-add-student');
    if (addBtn) {
      addBtn.addEventListener('click', () => {
        alert('Add Student feature coming soon!');
      });
    }
  </script>
</body>
</html>
