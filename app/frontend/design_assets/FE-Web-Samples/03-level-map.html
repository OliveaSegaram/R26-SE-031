<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptedMind - Level Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      background-image: url('assets/images/backgrounds/new-map.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Fredoka One', cursive;
    }

    /* ══════════════════════════
       BACK BUTTON
    ══════════════════════════ */
    .nav-back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ff6ec7, #e0157a);
      border: 3px solid #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #a00d55, 0 6px 16px rgba(0, 0, 0, 0.35);
      z-index: 100;
      transition: transform .1s, box-shadow .1s;
    }

    .nav-back-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #a00d55, 0 3px 8px rgba(0, 0, 0, 0.3);
    }

    .nav-back-btn svg {
      width: 28px;
      height: 28px;
      margin-right: 4px;
    }

    /* ══════════════════════════
       CHARACTER
    ══════════════════════════ */
    #character {
      position: absolute;
      width: 9%;
      z-index: 50;
      pointer-events: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
      transition: none;
    }

    #character img {
      width: 100%;
      height: auto;
      display: block;
      /* Add white circle behind the eye */
      background: radial-gradient(circle at 50% 43%, #fff 0%, #fff 16%, transparent 16.5%);
      border-radius: 50%;
    }

    /* Idle state (no animation, just standing still) */
    #character.idle {
      /* Character stands still */
    }

    /* Walking animation (used during movement) */
    #character.walking {
      animation: walk-bounce 0.35s ease-in-out infinite;
    }

    @keyframes walk-bounce {

      0%,
      100% {
        transform: translate(-50%, -85%) translateY(0) scaleX(1);
      }

      50% {
        transform: translate(-50%, -85%) translateY(-8px) scaleX(1);
      }
    }

    /* Celebration when arriving at new node */
    /* Celebrate state (no animation) */
    #character.celebrate {
      /* Character stands still after arriving */
    }

    /* ══════════════════════════
       DEBUG / DEV BUTTON
    ══════════════════════════ */
    .dev-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 24px;
      border-radius: 30px;
      border: 3px solid #fff;
      background: linear-gradient(135deg, #5cdd3c, #3ab820);
      color: #fff;
      font-family: 'Fredoka One', cursive;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1d7010, 0 6px 16px rgba(0, 0, 0, 0.3);
      z-index: 100;
      transition: transform .1s, box-shadow .1s;
    }

    .dev-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1d7010, 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    .dev-btn.reset {
      right: auto;
      left: 20px;
      bottom: 20px;
      background: linear-gradient(135deg, #ff6b6b, #e03030);
      box-shadow: 0 4px 0 #a01818, 0 6px 16px rgba(0, 0, 0, 0.3);
    }

    .dev-btn.reset:active {
      box-shadow: 0 1px 0 #a01818, 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    /* ══════════════════════════
       SPARKLE PARTICLES
    ══════════════════════════ */
    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 55;
      animation: sparkle-fade 0.8s ease-out forwards;
    }

    @keyframes sparkle-fade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0) translateY(-30px);
      }
    }
  </style>
</head>

<body>
  <!-- Back Button -->
  <button id="btn-back" class="nav-back-btn" title="Go Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6" />
    </svg>
  </button>

  <!-- Character on the map -->
  <div id="character" class="idle">
    <img src="assets/images/characters/character.png" alt="Monster Character">
  </div>

  <!-- Dev buttons for testing -->
  <button class="dev-btn" id="btn-complete" title="Complete current level">✓ Complete Level</button>
  <button class="dev-btn reset" id="btn-reset" title="Reset progress">↺ Reset</button>

  <script>
    // ═══════════════════════════════════════════
    //  NODE POSITIONS (% of viewport)
    //  Mapped to the bubble positions in new-map.png
    // ═══════════════════════════════════════════
    const nodes = [
      { id: 1, x: 22, y: 62 },  // Node 1 (green)
      { id: 2, x: 23, y: 78 },  // Node 2
      { id: 3, x: 34, y: 66 },  // Node 3
      { id: 4, x: 35.5, y: 76 },  // Node 4 (Egg අ)
      { id: 5, x: 43, y: 59 },  // Node 4
      { id: 6, x: 49, y: 70 },  // Node 5
      { id: 7, x: 55, y: 79 },  // Node 8 (Egg ක)
      { id: 8, x: 63, y: 66 },  // Node 7
      { id: 9, x: 73, y: 60 },  // Node 11
      { id: 10, x: 78, y: 75 },  // Node 12
      { id: 11, x: 87, y: 64 },  // Compass area
      { id: 12, x: 88, y: 82 },  // Node 12 (Egg අම්මා)
    ];

    // ═══════════════════════════════════════════
    //  PATH WAYPOINTS between nodes
    //  These are intermediate % positions the character
    //  follows to trace the curved path on the map
    // ═══════════════════════════════════════════
    const pathWaypoints = {
      '1-2': [{ x: 22, y: 65 }, { x: 22, y: 70 }, { x: 22.5, y: 74 }],
      '2-3': [{ x: 25, y: 76 }, { x: 28, y: 74 }, { x: 31, y: 70 }],
      '3-4': [{ x: 34.5, y: 69 }, { x: 35, y: 72 }],
      '4-5': [{ x: 36, y: 73 }, { x: 38, y: 68 }, { x: 40, y: 63 }],
      '5-6': [{ x: 44, y: 62 }, { x: 46, y: 65 }, { x: 48, y: 68 }],
      '6-7': [{ x: 50, y: 73 }, { x: 52, y: 76 }],
      '7-8': [{ x: 57, y: 77 }, { x: 59, y: 73 }, { x: 61, y: 69 }],
      '8-9': [{ x: 65, y: 64 }, { x: 68, y: 62 }, { x: 71, y: 60 }],
      '9-10': [{ x: 74, y: 63 }, { x: 76, y: 67 }, { x: 77, y: 72 }],
      '10-11': [{ x: 80, y: 73 }, { x: 83, y: 70 }, { x: 85, y: 67 }],
      '11-12': [{ x: 87, y: 68 }, { x: 87.5, y: 73 }, { x: 88, y: 78 }],
    };

    // ═══════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════
    let currentLevel = parseInt(localStorage.getItem('aceCurrentLevel') || '1');
    let isMoving = false; // Lock to prevent overlapping animations
    const character = document.getElementById('character');

    // ── Place character at a node instantly ──
    function placeAt(nodeIndex) {
      const node = nodes[nodeIndex - 1];
      if (!node) return;
      character.style.left = node.x + '%';
      character.style.top = node.y + '%';
    }

    // ── Spawn sparkle particles at character position ──
    function spawnSparkles(x, y) {
      const colors = ['#ffd700', '#ff6ec7', '#5cdd3c', '#64b5f6', '#fff'];
      for (let i = 0; i < 8; i++) {
        const spark = document.createElement('div');
        spark.className = 'sparkle';
        spark.style.left = x + '%';
        spark.style.top = y + '%';
        spark.style.background = colors[Math.floor(Math.random() * colors.length)];
        spark.style.width = (6 + Math.random() * 8) + 'px';
        spark.style.height = spark.style.width;
        spark.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
        spark.style.animationDelay = (Math.random() * 0.2) + 's';
        // Random direction
        const angle = Math.random() * Math.PI * 2;
        const dist = 15 + Math.random() * 25;
        spark.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        spark.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        document.body.appendChild(spark);
        setTimeout(() => spark.remove(), 1200);
      }
    }

    // ═══════════════════════════════════════════
    //  ANIMATE ALONG PATH
    //  Moves character through waypoints smoothly
    // ═══════════════════════════════════════════
    function animateAlongPath(fromNode, toNode) {
      return new Promise((resolve) => {
        const key = fromNode + '-' + toNode;
        const waypoints = pathWaypoints[key] || [];
        const startNode = nodes[fromNode - 1];
        const endNode = nodes[toNode - 1];

        // Full point sequence: start → waypoints → end
        const points = [
          { x: startNode.x, y: startNode.y },
          ...waypoints,
          { x: endNode.x, y: endNode.y }
        ];

        // Flip character to face movement direction
        const goingRight = endNode.x > startNode.x;
        character.style.transform = goingRight
          ? 'translate(-50%, -50%) scaleX(1)'
          : 'translate(-50%, -50%) scaleX(-1)';

        // Remove idle, add walking
        character.classList.remove('idle', 'celebrate');
        character.classList.add('walking');

        let pointIndex = 0;
        const stepDuration = 280; // ms per waypoint step

        function moveToNext() {
          if (pointIndex >= points.length - 1) {
            // Arrived at destination
            character.classList.remove('walking');
            character.style.transform = '';
            character.classList.add('celebrate');

            // Spawn sparkles at arrival
            spawnSparkles(endNode.x, endNode.y);

            // After celebration, go back to idle
            setTimeout(() => {
              character.classList.remove('celebrate');
              character.classList.add('idle');
              resolve();
            }, 1600);
            return;
          }

          pointIndex++;
          const next = points[pointIndex];

          // Smooth CSS transition for this segment
          character.style.transition = `left ${stepDuration}ms linear, top ${stepDuration}ms linear`;
          character.style.left = next.x + '%';
          character.style.top = next.y + '%';

          setTimeout(moveToNext, stepDuration);
        }

        moveToNext();
      });
    }

    // ═══════════════════════════════════════════
    //  COMPLETE LEVEL → Move to next node
    // ═══════════════════════════════════════════
    async function completeLevel() {
      // Prevent overlapping animations
      if (isMoving) return;

      if (currentLevel >= nodes.length) {
        // Already at final node
        spawnSparkles(nodes[currentLevel - 1].x, nodes[currentLevel - 1].y);
        return;
      }

      isMoving = true;

      const from = currentLevel;
      const to = currentLevel + 1;

      // Update level BEFORE animation so rapid clicks can't double-fire
      currentLevel = to;
      localStorage.setItem('aceCurrentLevel', String(currentLevel));

      await animateAlongPath(from, to);

      isMoving = false;
    }

    // ═══════════════════════════════════════════
    //  RESET
    // ═══════════════════════════════════════════
    function resetProgress() {
      currentLevel = 1;
      localStorage.setItem('aceCurrentLevel', '1');
      character.classList.remove('walking', 'celebrate');
      character.style.transition = 'none';
      placeAt(1);
      // Force reflow then re-add idle
      void character.offsetWidth;
      character.classList.add('idle');
    }

    // ═══════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════
    placeAt(currentLevel);
    character.classList.add('idle');

    // ── Button listeners ──
    document.getElementById('btn-back').addEventListener('click', () => {
      window.location.href = '02-dashboard.html';
    });

    document.getElementById('btn-complete').addEventListener('click', completeLevel);
    document.getElementById('btn-reset').addEventListener('click', resetProgress);
  </script>
</body>

</html>
