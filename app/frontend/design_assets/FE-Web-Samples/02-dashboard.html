<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptedMind - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fredoka+One&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }

    /* ══════════════════════════
       BLURRED BACKGROUND
    ══════════════════════════ */
    .bg-blurred {
      position: fixed;
      inset: 0;
      background-image: url('assets/images/backgrounds/new-map.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(25px) brightness(1.05) saturate(1.2);
      transform: scale(1.1);
      z-index: 0;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.08);
      z-index: 1;
    }

    /* ══════════════════════════
       CONTENT
    ══════════════════════════ */
    .content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ══════════════════════════
       TOP CATEGORY BAR
    ══════════════════════════ */
    .category-bar {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      padding: 18px 20px 12px;
      position: relative;
    }

    .category-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 16px;
      transition: background 0.2s, transform 0.15s;
      border: none;
      background: transparent;
      text-decoration: none;
    }

    .category-item:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-3px);
    }

    .category-item.active {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-3px);
    }

    .category-icon {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
      transition: transform 0.15s;
    }

    .category-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .category-item:hover .category-icon {
      transform: scale(1.12);
    }

    .category-label {
      font-family: 'Fredoka One', cursive;
      font-size: 12px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    /* ── User greeting (top-right) ── */
    .user-greeting {
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 30px;
      transition: background 0.2s;
    }

    .user-greeting:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .user-greeting span {
      font-family: 'Fredoka One', cursive;
      font-size: 18px;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    .user-avatar {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      border: 3px solid #fff;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
      object-fit: cover;
      background: radial-gradient(circle at 50% 43%, #fff 0%, #fff 16%, transparent 16.5%), linear-gradient(135deg, #ffe0b2, #fff3e0);
    }

    /* ══════════════════════════
       STORY CARDS GRID
    ══════════════════════════ */
    .cards-section {
      flex: 1;
      padding: 12px 24px 30px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 18px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ── Individual Card ── */
    .story-card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      box-shadow:
        0 6px 24px rgba(0, 0, 0, 0.15),
        0 2px 6px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275),
        box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .story-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.22),
        0 4px 12px rgba(0, 0, 0, 0.12);
    }

    .story-card:active {
      transform: translateY(-2px) scale(1.0);
    }

    .card-image-wrapper {
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      position: relative;
    }

    .card-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }

    .story-card:hover .card-image-wrapper img {
      transform: scale(1.06);
    }

    /* Progress bar on card */
    .card-progress {
      position: absolute;
      bottom: 8px;
      left: 12px;
      right: 12px;
      height: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      overflow: hidden;
    }

    .card-progress-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #5cdd3c, #3ab820);
      transition: width 0.4s;
    }

    .card-title {
      padding: 14px 16px;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(16px, 2vw, 22px);
      color: #1a237e;
      text-align: center;
      letter-spacing: 0.3px;
    }

    /* ── Bottom row: 3 smaller cards ── */
    .cards-grid-bottom {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      max-width: 1100px;
      margin: 0 auto;
      margin-top: 18px;
    }

    .cards-grid-bottom .card-image-wrapper {
      aspect-ratio: 1;
    }

    .cards-grid-bottom .card-title {
      font-size: clamp(13px, 1.5vw, 17px);
      padding: 10px 10px;
    }

    /* ══════════════════════════
       RESPONSIVE
    ══════════════════════════ */
    @media (max-width: 768px) {
      .category-bar {
        gap: 4px;
        padding: 12px 10px 8px;
      }

      .category-icon {
        width: 40px;
        height: 40px;
        font-size: 30px;
      }

      .category-label {
        font-size: 10px;
      }

      .user-greeting span {
        display: none;
      }

      .user-avatar {
        width: 40px;
        height: 40px;
      }

      .cards-section {
        padding: 8px 12px 20px;
      }

      .cards-grid {
        gap: 12px;
      }

      .cards-grid-bottom {
        gap: 12px;
        margin-top: 12px;
      }
    }

    @media (max-width: 500px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }

      .cards-grid-bottom {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- Blurred Background Layer -->
  <div class="bg-blurred"></div>
  <div class="bg-overlay"></div>

  <!-- Main Content -->
  <div class="content">

    <!-- ═══════════ CATEGORY BAR ═══════════ -->
    <nav class="category-bar">
      <!-- Category Icons -->
      <button class="category-item active" title="Top Picks">
        <div class="category-icon"><img src="assets/images/icons/icon-star.png" alt="Top Picks"></div>
        <span class="category-label">Top Picks</span>
      </button>

      <button class="category-item" title="Friends">
        <div class="category-icon"><img src="assets/images/icons/icon-friends.png" alt="Friends"></div>
        <span class="category-label">Friends</span>
      </button>

      <button class="category-item" title="Health">
        <div class="category-icon"><img src="assets/images/icons/icon-health.png" alt="Health"></div>
        <span class="category-label">Health</span>
      </button>

      <button class="category-item" title="ABC Letters">
        <div class="category-icon"><img src="assets/images/icons/icon-abc.png" alt="ABC"></div>
        <span class="category-label">ABC</span>
      </button>

      <button class="category-item" title="Science">
        <div class="category-icon"><img src="assets/images/icons/icon-science.png" alt="Science"></div>
        <span class="category-label">Science</span>
      </button>

      <button class="category-item" title="World">
        <div class="category-icon"><img src="assets/images/icons/icon-globe.png" alt="World"></div>
        <span class="category-label">World</span>
      </button>

      <!-- User Greeting -->
      <div class="user-greeting" id="user-greeting" title="Profile">
        <span>Hi, Ace</span>
        <img class="user-avatar" src="assets/images/characters/character.png" alt="Ace">
      </div>
    </nav>

    <!-- ═══════════ STORY CARDS ═══════════ -->
    <div class="cards-section">

      <!-- Top Row: 2 large cards -->
      <div class="cards-grid">
        <div class="story-card" data-story="shark">
          <div class="card-image-wrapper">
            <img src="assets/images/cards/card-shark.png" alt="Clark the Shark">
            <div class="card-progress">
              <div class="card-progress-fill" style="width: 35%;"></div>
            </div>
          </div>
          <div class="card-title">Clark the Shark</div>
        </div>

        <div class="story-card" data-story="pyramid">
          <div class="card-image-wrapper">
            <img src="assets/images/cards/card-pyramid.png" alt="Pyramid">
          </div>
          <div class="card-title">Pyramid</div>
        </div>
      </div>

      <!-- Bottom Row: 3 smaller cards -->
      <div class="cards-grid-bottom">
        <div class="story-card" data-story="monster">
          <div class="card-image-wrapper">
            <img src="assets/images/cards/card-monster.png" alt="Monster School">
          </div>
          <div class="card-title">Monster School</div>
        </div>

        <div class="story-card" data-story="animals">
          <div class="card-image-wrapper">
            <img src="assets/images/cards/card-animals.png" alt="Safari Animals">
          </div>
          <div class="card-title">Safari Animals</div>
        </div>

        <div class="story-card" data-story="wish">
          <div class="card-image-wrapper">
            <img src="assets/images/cards/card-wish.png" alt="I Wish You More">
          </div>
          <div class="card-title">I Wish You More</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ── Card click → navigate to map page ──
    document.querySelectorAll('.story-card').forEach(card => {
      card.addEventListener('click', () => {
        window.location.href = '03-level-map.html';
      });
    });

    // ── User greeting click → back to student select ──
    const greeting = document.getElementById('user-greeting');
    if (greeting) {
      greeting.addEventListener('click', () => {
        window.location.href = '01-select-student.html';
      });
    }

    // ── Category buttons active state toggle ──
    document.querySelectorAll('.category-item').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.category-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
</body>

</html>
