name: sipsara_app
description: "Sipsara - Learn, Play & Grow! An adaptive learning app for grade 1 students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.0.0
  font_awesome_flutter: ^11.0.0
  http: ^1.1.0
  audioplayers: ^5.2.1
  shared_preferences: ^2.5.5
  intl: ^0.19.0
  google_sign_in: ^7.2.0
  aad_oauth: ^1.0.1
  flutter_tts: ^4.2.5
  device_info_plus: ^12.4.0
  uuid: ^4.6.0
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  fl_chart: ^1.2.0
  sensors_plus: ^7.1.0
  share_plus: ^12.0.2
  just_audio: ^0.10.6

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/backgrounds/
    - assets/images/cards/
    - assets/images/characters/
    - assets/images/icons/
    - assets/images/skills/
    - assets/thumbnails/
    - assets/audio/
    - assets/data/
    - assets/data/curriculum/
    - assets/data/curriculum/skill_1/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
