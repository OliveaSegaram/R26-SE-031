name: sipsara_app
description: "Sipsara - Learn, Play & Grow! An adaptive learning app for grade 1 students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.0.0
  font_awesome_flutter: ^11.0.0
  http: ^1.1.0
  audioplayers: ^5.2.1
  shared_preferences: ^2.5.5
  intl: ^0.19.0
  google_sign_in: ^7.2.0
  aad_oauth: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/backgrounds/
    - assets/images/cards/
    - assets/images/characters/
    - assets/images/icons/
    - assets/images/skills/
    - assets/thumbnails/
    - assets/audio/
    - assets/data/curriculum/
